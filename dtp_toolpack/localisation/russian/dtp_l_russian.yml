 dqspcho5:0 "§gКорабль-метка — отмечать системы прямо на карте§!"
 dqql0pf9:0 "Корабль-метка: создать"
 dqisskb8:0 "Создать у вашей столицы корабль-метку. Его видите только вы: маскировка 1000 — ни игроки, ни ИИ его не обнаружат. Скорость ×5000, прыжок без разгона и перезарядки, дальность прыжка ×1000. Как отмечать: выделите корабль, ПКМ по любой системе на большой карте (и ничьей) — отмечается каждая система, в которую корабль входит, — весь путь (лишнее снимается кнопкой «Снять все отметки» или режимом «СНИМАЕТ»). Режим «СНИМАЕТ» (кнопка слева сверху) — корабль, наоборот, убирает отметки."
