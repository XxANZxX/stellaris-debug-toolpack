 dtp_b_sb_when:0 "§gснимок: [dtp_sb_owner.dtp_sb_y] г.§!"
 dtp_b_sb_v0:0 "→ Доход/мес"
 dtp_b_sb_v0_tt:0 "Сейчас: «Развитие». Нажмите, чтобы показать «Доход в месяц». Флот и дипломатический вес видны всегда; наборы: развитие → доход в месяц → наука и редкие ресурсы → запасы на складе."
 dtp_b_sb_v1:0 "→ Наука, редкие"
 dtp_b_sb_v1_tt:0 "Сейчас: «Доход в месяц». Нажмите, чтобы показать «Наука и редкие в месяц». Флот и дипломатический вес видны всегда; наборы: развитие → доход в месяц → наука и редкие ресурсы → запасы на складе."
 dtp_b_sb_v2:0 "→ Запасы"
 dtp_b_sb_v2_tt:0 "Сейчас: «Наука и редкие в месяц». Нажмите, чтобы показать «Запасы на складе». Флот и дипломатический вес видны всегда; наборы: развитие → доход в месяц → наука и редкие ресурсы → запасы на складе."
 dtp_b_sb_v3:0 "→ Развитие"
 dtp_b_sb_v3_tt:0 "Сейчас: «Запасы на складе». Нажмите, чтобы показать «Развитие». Флот и дипломатический вес видны всегда; наборы: развитие → доход в месяц → наука и редкие ресурсы → запасы на складе."
