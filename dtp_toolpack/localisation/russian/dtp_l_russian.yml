 dtp_opinion_bad:0 "Toolpack: ухудшение отношений"
 dtp_note_humans:0 "§Y● Только живые игроки§! §g— державы ИИ не затрагиваются.§!"
 dtp_note_pvp:0 "§Y● Только между живыми игроками§! §g— войны с ИИ и между ИИ идут как обычно.§!"
 dtp_gm_nowar:0 "§RЭто держава Гейм-мастера:§! ей нельзя объявить войну (Debug Toolpack)."
 dtp_gm_noclose:0 "§RЭто держава Гейм-мастера:§! закрывать для неё границы нельзя (Debug Toolpack)."
 dtp_gm_nobranch:0 "§RЭто держава Гейм-мастера:§! филиалы мегакорпораций и синдикатов на её планетах запрещены (Debug Toolpack)."
 ethic_dtp_gamemaster:0 "Гейм-мастер"
 ethic_dtp_gamemaster_desc:0 "Закрытая этика ведущего партии (Debug Toolpack). Её нельзя выбрать при создании державы — только взять роль Гейм-мастера."
 dtp_gm_role:0 "Роль Гейм-мастера"
 dtp_gm_role_desc:0 "Держава ведущего партии (Debug Toolpack): видит всю галактику, огромные бонусы к науке и ресурсам, население не растёт, в Галактическом сообществе не участвует."
 dtp_gamemaster:0 "Гейм-мастер"
 dtp_war_banned:0 "§RЗапрещено ведущим партии:§! сейчас объявлять войну нельзя никому — как при политике «Оборонительные войны» (Debug Toolpack → «Правила партии»)."
 dtp_war_np:0 "§RЗапрещено ведущим партии:§! вашей державе лично запрещено объявлять войну (Debug Toolpack)."
 dtp_war_prot:0 "§RЗапрещено ведущим партии:§! эта держава под защитой ведущего — на неё нельзя нападать (Debug Toolpack)."
 dtp_mm_viol:0 "§H[This.GetName]§! — нарушил запрет войн, ведущий решает о санкциях"
 dtp_mm_prot:0 "§G[This.GetName]§! — под защитой ведущего: игрокам нельзя нападать"
 dtp_mm_np:0 "§R[This.GetName]§! — ведущий лично запретил объявлять войну"
 dtp_mm_ban:0 "§B[This.GetName]§! — игрок, действует общий запрет войн"
 dtp_mm_pl:0 "§Y[This.GetName]§! — игрок, войны разрешены"
 dtp_mm_ai:0 "[This.GetName] — держава ИИ"
 dtp_rules_map_mode:0 "Правила партии (Debug Toolpack)"
 dtp_rules_map_mode_desc:0 "Режим карты ведущего: §Hоранжевый§! — нарушитель, §Gзелёный§! — под защитой, §Rкрасный§! — лично запрещено нападать, §Bсиний§! — игрок при общем запрете войн, светлый — игрок, тёмный — ИИ."
