 dtp_b_mb_mgrow:0 "Расширить на соседние"
 dtp_b_mb_mgrow_tt:0 "Отметить все системы, соседние с уже отмеченными (по гиперкоридорам)."
 dtp_b_mb_mclaim:0 "Претензии B"
 dtp_b_mb_mclaim_tt:0 "Получатель получает претензии на все отмеченные системы."
 dtp_b_mb_mop:0 "Заставы B"
 dtp_b_mb_mop_tt:0 "Построить заставы получателя во всех ничьих отмеченных системах."
 dtp_b_mb_mclear:0 "Снять все отметки"
 dtp_b_mb_mclear_tt:0 "Снять отметки со всех систем — красные метки над ними на карте тоже пропадут."
 dtp_b_m_tr:0 "Передать отмеченные → B"
 dtp_b_m_tr_tt:0 "Передать получателю все отмеченные системы со станциями и планетами (до 100). Нужно подтверждение."
 dtp_b_m_free:0 "Сделать ничьими"
 dtp_b_m_free_tt:0 "Снести станции во всех отмеченных системах — они станут ничьими. Если в системе есть колония, игра оставит систему за владельцем колонии — для этого есть «Ничьи + снести колонии». Нужно подтверждение."
 dtp_b_m_tr_ok:0 "§YПОДТВЕРДИТЬ:§! передать ВСЕ отмеченные системы получателю"
 dtp_b_m_tr_ok_tt:0 "Подтвердить и выполнить действие, указанное на кнопке. «Отмена» справа — ничего не менять."
 dtp_b_m_tr_ok_x:0 "Отмена"
 dtp_b_m_tr_ok_x_tt:0 "Отменить — ничего не менять."
 dtp_b_m_free_ok:0 "§YПОДТВЕРДИТЬ:§! снести станции во всех отмеченных системах"
 dtp_b_m_free_ok_tt:0 "Подтвердить и выполнить действие, указанное на кнопке. «Отмена» справа — ничего не менять."
 dtp_b_m_free_ok_x:0 "Отмена"
 dtp_b_m_free_ok_x_tt:0 "Отменить — ничего не менять."
 dtp_b_m_star_on:0 "Красные метки над системами: ВКЛ"
 dtp_b_m_star_on_tt:0 "Сейчас над каждой отмеченной системой на большой карте — красная метка «● ОТМЕЧЕНО». Её видят ВСЕ игроки. Снял отметку — метка пропадает. Нажмите, чтобы убрать метки (отметки останутся в списке)."
 dtp_b_m_star_off:0 "Красные метки над системами: ВЫКЛ"
 dtp_b_m_star_off_tt:0 "Включить: над каждой отмеченной системой на большой карте появится красная метка «● ОТМЕЧЕНО» (видят все игроки)."
 dtp_b_m_reveal:0 "Открыть мне всю карту"
 dtp_b_m_reveal_tt:0 "Все системы галактики становятся для вашей державы посещёнными: пропадает «неизведанное пространство», видны звёзды, гиперлинии и владельцы. Это игровое действие — только для вас."
 dtp_b_m_survey:0 "Изучить мне все планеты"
 dtp_b_m_survey_tt:0 "Все планеты галактики становятся исследованными для вашей державы (видны ресурсы и пригодность). Это игровое действие — только для вас."
 dtp_b_mk_mode_m:0 "Корабль: §RОТМЕЧАЕТ§! системы"
 dtp_b_mk_mode_m_tt:0 "Сейчас корабль-метка ОТМЕЧАЕТ системы: залетел — система отмечена (уже отмеченные не трогает). Нажмите — режим СНИМАТЬ отметки."
 dtp_b_mk_mode_u:0 "Корабль: §GСНИМАЕТ§! отметки"
 dtp_b_mk_mode_u_tt:0 "Сейчас корабль-метка СНИМАЕТ отметки: залетел в отмеченную систему — отметка снята (неотмеченные не трогает). Нажмите — режим ОТМЕЧАТЬ."
 dtp_b_mk_how0:0 "§gКорабль-метка — отмечать системы прямо на карте§!"
 dtp_b_mk_new:0 "Корабль-метка: создать"
 dtp_b_mk_new_tt:0 "Создать у вашей столицы корабль-метку. Его видите только вы: маскировка 1000 — ни игроки, ни ИИ его не обнаружат. Скорость ×5000, прыжок без разгона и перезарядки, дальность прыжка ×1000. Как отмечать: выделите корабль, ПКМ по любой системе на большой карте (и ничьей) — отмечается каждая система, в которую корабль входит, — весь путь (лишнее снимается кнопкой «Снять все отметки» или режимом «СНИМАЕТ»). Режим «СНИМАЕТ» (кнопка слева сверху) — корабль, наоборот, убирает отметки."
 dtp_b_mk_del:0 "Корабль-метка: убрать"
 dtp_b_mk_del_tt:0 "Убрать корабль-метку. Отметки систем останутся."
 dtp_need_cur:0 "Сначала выберите систему в навигаторе"
 dtp_b_mk_cur:0 "Корабль → к курсору навигатора"
 dtp_b_mk_cur_tt:0 "Мгновенно перенести корабль-метку в систему под курсором навигатора (без отметки)."
 dtp_b_mk_home:0 "Корабль → к моей столице"
 dtp_b_mk_home_tt:0 "Мгновенно вернуть корабль-метку к вашей столице (без отметки)."
 dtp_need_force:0 "Нужен принудительный режим (вкладка «Государство»)"
 dtp_b_m_free2:0 "Ничьи + снести колонии"
 dtp_b_m_free2_tt:0 "Уничтожить колонии в отмеченных системах и снести станции: системы станут полностью ничьими (принудительный режим). Нужно подтверждение."
 dtp_b_m_free2_ok:0 "§YПОДТВЕРДИТЬ:§! УНИЧТОЖИТЬ колонии и станции в отмеченных системах"
