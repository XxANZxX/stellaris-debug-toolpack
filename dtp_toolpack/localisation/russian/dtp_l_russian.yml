 dqczofw1:0 "§GОК§!"
 dqoxbaav:0 "§RОТКАЗ§!"
 dqf0hpsb:0 "§HНЕ ВЫПОЛНЕНО§!"
 dqpa3klv:0 "§YПРОВЕРКА РАБОТЫ МОДА§!  §gтесты, а не инструменты: каждый сам всё возвращает; итог — в строке снизу§!"
 dqoj1jia:0 "Тест: бонус планеты"
 dqnjl8u3:0 "Ставит выбранной планете модификатор Toolpack, проверяет, что он есть, и убирает."
 dq6boupf:0 "Тест: бонус державы A"
 dqzpebvs:0 "Ставит державе A модификатор игры «Учения флота», проверяет и убирает."
 dq8hrmi1:0 "Тест: отметка системы"
 dqsned4b:0 "Отмечает систему выбранной планеты, проверяет отметку и снимает её (если система не была отмечена). Строки DTP MARK в game.log покажут, сменились ли звезда и имя."
 dq5vrwg0:0 "Тест: ресурсы A"
 dqxmgb2f:0 "Добавляет державе A 1 энергию, проверяет склад и возвращает обратно."
 dqshpnc9:0 "§YDEBUG TOOLPACK§! · [This.GetName] §g— полосу можно тянуть§!"
 dql3in3a:0 "Выбрать"
 dqqkye0g:0 "Сделать эту планету (или звезду) выбранной в Toolpack — вкладка «Планета»."
 dqyu2wdy:0 "§G●§! Выбрана"
 dqaoxax1:0 "Эта планета (или звезда) уже выбрана в Toolpack — с ней работает вкладка «Планета»."
 dq4a3z5x:0 "Изменять эту державу"
 dqu9mlqa:0 "Передавать этой державе"
 dqdzuvf0:0 "§R●§! ОТМЕТИТЬ систему   Alt+M"
 dqsear6p:0 "Отметить эту систему (Alt+M, пока открыто окно планеты или звезды). Над системой на галактической карте появится красная метка «● ОТМЕЧЕНО» (если метки включены). Все отметки — во вкладке «Системы»."
 dqs9377b:0 "× Снять отметку   Alt+M"
 dq4th3qk:0 "Снять отметку с этой системы (Alt+M) — красная метка над ней пропадёт."
 dqvb9gmp:0 "§R● СИСТЕМА ОТМЕЧЕНА§!"
 dq6kyrb5:0 "§gсистема не отмечена§!"
 dqmyd39h:0 "§YDEBUG TOOLPACK§! · флот"
 dqjzgjgy:0 "Выбрать флот"
 dqwlkgrj:0 "Сделать этот флот выбранным в Toolpack — вкладка «Флот»."
 dq91c2od:0 "§G●§! Выбран"
 dqkxeqah:0 "Этот флот уже выбран в Toolpack — с ним работает вкладка «Флот»."
 dqz42pd3:0 "Изменять эту державу"
 dqu8u3r6:0 "Ремонт"
 dqf4dtvc:0 "§R●§! Отметить систему флота"
 dqvj1z13:0 "+ §Y[From.dtp_shn]§! кораблей"
 dqq8mdmr:0 "Добавить в ЭТОТ флот корабли из конструктора (Debug Toolpack → «Флот»): тип и количество — как выбрано там. Строятся по кораблю/проекту владельца флота этого типа. §HЕсли у владельца этот тип корабля не изучен — кораблей не будет.§!"
 dqfm8x58:0 "× Снять отметку системы"
 dqaexvjk:0 "§YDEBUG TOOLPACK§! · [This.GetName] §g— полосу можно тянуть§!"
 dqkch3xr:0 "§R●§! ОТМЕТИТЬ систему   Alt+M"
 dqf7zv2o:0 "Отметить систему этой станции. Окно станции открывается кликом по значку станции на галактической карте — в систему заходить не нужно."
 dqtkf1hj:0 "× Снять отметку   Alt+M"
 dqhr4i5k:0 "§R● СИСТЕМА ОТМЕЧЕНА§!"
 dq4oq2lt:0 "§gсистема не отмечена§!"
 dqem28xx:0 "Выбрать звезду"
 dq48dphd:0 "Звезда этой системы станет выбранной планетой Toolpack (вкладка «Планета»: класс звезды и т. п.)."
 dqh8xre7:0 "Изменять эту державу"
 dqehzsim:0 "Передавать этой державе"
 dtp.13.name:0 "Запрос статуса ХОСТа"
 dtp.13.desc:0 "Игрок §Y[dtp_claimant.GetName]§! запрашивает статус §YХОСТа§! Debug Toolpack.\n\nХОСТ получит полный доступ к инструментам для всех государств, включая ваше. Голосуйте «За», только если это действительно хост партии."
 dtp.13.o0:0 "Против"
 dtp.13.o1:0 "За — это хост партии"
 dtp.14.name:0 "Голосование истекло"
 dtp.14.desc:0 "Не все игроки ответили за 30 дней. Запрос отменён."
 dtp.14.o0:0 "Понятно"
 dtp.15.name:0 "Передача статуса ХОСТа"
 dtp.15.desc:0 "ХОСТ §Y[dtp_offer_from.GetName]§! предлагает передать вам статус §YХОСТа§! Debug Toolpack."
 dtp.15.o0:0 "Отказаться"
 dtp.15.o1:0 "Принять"
 dtp.19.name:0 "Роль Гейм-мастера"
 dtp.19.desc:0 "Вы стали §YХОСТОМ§! партии. Debug Toolpack предлагает взять §YРОЛЬ ГЕЙМ-МАСТЕРА§! — ведущего, который управляет партией, а не соревнуется с игроками.\n\n§YЧТО ДАЁТ РОЛЬ§!\n§G+§! вы видите всю галактику: все системы, флоты и державы (полный обзор, вся карта, контакт со всеми)\n§G+§! разведка, шифровка и дешифровка 1000 — от вас ничего не скрыто, вас не разведать\n§G+§! наука и все ресурсы ×1000, склады +1 000 000, стабильность +50\n§G+§! закрытая этика «Гейм-мастер» — её нельзя выбрать при создании державы\n§G+§! вам нельзя объявить войну и закрыть для вас границы; филиалы мегакорпораций и синдикатов на ваших планетах запрещены\n§G+§! сами вы можете всё: войны, договоры, границы\n\n§RВАЖНО: ИГРАТЬ КАК ОБЫЧНАЯ ДЕРЖАВА ВЫ НЕ СМОЖЕТЕ§!\n§R−§! ваша держава становится особым типом «Гейм-мастер», как угасшая империя: население не растёт\n§R−§! в Галактическое сообщество вас не примут, и вы не участвуете в его создании\n§R−§! часть обычных механик (политики, дипломатические позиции, специализации планет) может быть недоступна\n§R−§! это роль ведущего: соревноваться с игроками за победу вы не будете\n\nРоль можно сложить в любой момент: Debug Toolpack → «Доступ» → «Сложить роль Гейм-мастера» — держава снова станет обычной."
 dtp.19.o0:0 "Принять роль Гейм-мастера"
 dtp.19.o1:0 "Не сейчас"
