 dqrerbhx:0 "Количество кораблей −10."
 dqgdhkmi:0 "Количество кораблей −1."
 dqa6kcyh:0 "Количество кораблей +1."
 dqpghiuo:0 "Количество кораблей +10."
 dqpcpwvb:0 "Все кнопки панели DTP (ресурсы, этики, технологии, флот…) будут действовать на владельца этой планеты. Он станет «державой A» в карточке сверху."
 dqntck2d:0 "Кнопки «Передать → B» (планету, флот, системы) будут отдавать всё владельцу этой планеты. Он станет «получателем B». Сама кнопка ничего не передаёт."
 dqqmhssr:0 "Все кнопки панели DTP (ресурсы, этики, технологии, флот…) будут действовать на владельца этого флота. Он станет «державой A» в карточке сверху."
 dq1gu4su:0 "Полностью отремонтировать этот флот."
