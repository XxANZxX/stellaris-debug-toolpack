 dtp_mark_mega_MEGASTRUCTURE_DETAILS:0 "Метка ведущего партии (Debug Toolpack). Ничего не делает."
 dtp_mark_mega_DESC:0 "Метка ведущего партии (Debug Toolpack): система отмечена. Ничего не делает, снимается кнопкой мода."
 dtp_beacon_ship:0 "Маяк DTP"
 dtp_beacon_ship_desc:0 "Маяк отметки ведущего: маскировка 1000 — виден только ХОСТу."
 DTP_Marker:0 "Метка DTP"
 dtp_war_lock_desc:0 "Ведущий партии запретил этой державе объявлять войну (Debug Toolpack, жёсткий режим). Кнопка «Объявить войну» недоступна, пока действует запрет; модификатор снимется сам, когда запрет закончится или ведущий его снимет."
 dtp_war_shield:0 "Защита ведущего"
 dtp_war_shield_desc:0 "Ведущий партии взял эту державу под защиту (Debug Toolpack, жёсткий режим): игроки не могут объявить ей войну, пока действует защита."
 dtp_claimfree_desc:0 "Пока включён режим отметки претензией, претензии ведущего бесплатны: каждая сразу превращается в отметку системы и убирается."
 dtp_marked_tt:0 "§R●§! Отмечено в Debug Toolpack"
 dtp_opinion_good:0 "Toolpack: улучшение отношений"
 dtp_opinion_bad:0 "Toolpack: ухудшение отношений"
 dtp_note_humans:0 "§Y● Только живые игроки§! §g— державы ИИ не затрагиваются.§!"
 dtp_note_pvp:0 "§Y● Только между живыми игроками§! §g— войны с ИИ и между ИИ идут как обычно.§!"
 dtp_gm_nowar:0 "§RЭто держава Гейм-мастера:§! ей нельзя объявить войну (Debug Toolpack)."
 dtp_gm_noclose:0 "§RЭто держава Гейм-мастера:§! закрывать для неё границы нельзя (Debug Toolpack)."
