 DTP_Marker:0 "Метка DTP"
 dtp_war_lock_desc:0 "Ведущий партии запретил этой державе объявлять войну (Debug Toolpack, жёсткий режим). Кнопка «Объявить войну» недоступна, пока действует запрет; модификатор снимется сам, когда запрет закончится или ведущий его снимет."
 dtp_war_shield:0 "Защита ведущего"
 dtp_war_shield_desc:0 "Ведущий партии взял эту державу под защиту (Debug Toolpack, жёсткий режим): игроки не могут объявить ей войну, пока действует защита."
 dtp_claimfree_desc:0 "Пока включён режим отметки претензией, претензии ведущего бесплатны: каждая сразу превращается в отметку системы и убирается."
 dtp_marked_tt:0 "§R●§! Отмечено в Debug Toolpack"
