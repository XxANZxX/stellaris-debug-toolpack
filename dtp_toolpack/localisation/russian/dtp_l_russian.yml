 dtp_b_gr_soft1:0 "Режим: МЯГКИЙ"
 dtp_b_gr_soft1_tt:0 "§YСейчас МЯГКИЙ режим.§! Кнопка «Объявить войну» работает как обычно. Если держава под запретом всё-таки объявит войну — это нарушение: всем игрокам придёт окно, а ведущий на этой странице решает — наказать («Унижение» на 5 лет) или простить. Модификаторов запрета нет. §gНажмите — включить ЖЁСТКИЙ режим.§!"
 dtp_b_gr_soft0:0 "Режим: ЖЁСТКИЙ"
 dtp_b_gr_soft0_tt:0 "§YСейчас ЖЁСТКИЙ режим.§! Как политика «Оборонительные войны», только политику менять не нужно: держава под запретом не может объявить войну никому — кнопка «Объявить войну» серая, причина — в подсказке. Запрет вписан в правило игры «можно ли объявить войну», его не обходят ни игроки, ни ИИ. Держава под запретом получает модификатор §R«Запрет войн ведущего»§!, держава под защитой — §G«Защита ведущего»§! (видны в модификаторах державы). §gНажмите — включить МЯГКИЙ режим.§!"
 dtp_b_gr_ai1:0 "ИИ: тоже под запретом"
 dtp_b_gr_ai1_tt:0 "Сейчас общий запрет касается и держав ИИ: они тоже не могут объявлять войны, а нападать на защищённые державы им тоже нельзя. Нажмите — запрет только для живых игроков."
 dtp_b_gr_ai0:0 "ИИ: не касается"
 dtp_b_gr_ai0_tt:0 "Сейчас общий запрет касается только живых игроков: они не могут объявить войну никому — ни игрокам, ни ИИ. Державы ИИ воюют как обычно. Нажмите — запрет и для держав ИИ."
