 dtp.1001.desc:0 "Тестовое событие Debug Toolpack от §Y[dtp_last_actor.GetName]§!."
 dtp.1001.o0:0 "Связь есть"
 dtp.1002.name:0 "Дар Хранителей"
 dtp.1002.desc:0 "Хранители предлагают вашей империи дар."
 dtp.1002.o0:0 "Энергия (+5000)"
 dtp.1002.o1:0 "Сплавы (+2000)"
 dtp.1002.o2:0 "Единство (+1000)"
 dtp.1003.name:0 "Волнения в столице"
 dtp.1003.desc:0 "В столице вспыхнули волнения."
 dtp.1003.o0:0 "Подавить силой"
 dtp.1003.o1:0 "Откупиться (−1000 энергии)"
 dtp.1004.name:0 "Геологическое открытие"
 dtp.1004.desc:0 "На планете §Y[Root.GetName]§! найдены новые залежи."
 dtp.1004.o0:0 "Отлично"
 dtp.1005.name:0 "Ремонтная бригада"
 dtp.1005.desc:0 "К флоту §Y[Root.GetName]§! прибыла ремонтная бригада."
 dtp.1005.o0:0 "Приступить"
 dtp.1006.name:0 "Научный прорыв"
 dtp.1006.desc:0 "Учёные совершили прорыв."
 dtp.1006.o0:0 "Превосходно"
 dtp.1007.name:0 "Мирное предложение"
 dtp.1007.desc:0 "§Y[dtp_last_actor.GetName]§! предлагает перемирие."
 dtp.1007.o0:0 "Отклонить"
 dtp.1007.o1:0 "Принять"
 dtp.1101.name:0 "§Y«ВЕДУЩИЙ»§! Перерыв в игре"
 dtp.1101.desc:0 "Ведущий объявил перерыв. Игра на паузе — вернёмся примерно через 10 минут.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1101.o0:0 "Понятно"
 dtp.1102.name:0 "§Y«ВЕДУЩИЙ»§! Сохранение и перезапуск"
 dtp.1102.desc:0 "Ведущий сохраняет партию и перезапускает сессию. Не выходите из лобби.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1102.o0:0 "Понятно"
 dtp.1103.name:0 "§Y«ВЕДУЩИЙ»§! Войны игроков разрешены"
 dtp.1103.desc:0 "С этого момента игроки могут объявлять войны. Правило запрета войн больше не действует.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1103.o0:0 "Понятно"
 dtp.1104.name:0 "§Y«ВЕДУЩИЙ»§! Войны игроков запрещены"
 dtp.1104.desc:0 "Войны игроков запрещены до особого объявления ведущего. §RПравило работает:§! кнопка «Объявить войну» заблокирована; если война всё же начнётся, все получат оповещение, а ведущий может наказать нарушителя.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1104.o0:0 "Понятно"
 dtp.1105.name:0 "§Y«ВЕДУЩИЙ»§! Предупреждение ведущего"
 dtp.1105.desc:0 "Ведущий напоминает о правилах партии. Повторное нарушение может привести к санкциям.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1105.o0:0 "Понятно"
 dtp.1106.name:0 "§Y«ВЕДУЩИЙ»§! Сессия скоро закончится"
 dtp.1106.desc:0 "До конца сегодняшней сессии осталось немного времени. Завершайте дела.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1106.o0:0 "Понятно"
 dtp.1107.name:0 "§Y«ВЕДУЩИЙ»§! Сессия окончена"
 dtp.1107.desc:0 "Сессия окончена. Сохранение у ХОСТа, продолжим в следующий раз в то же время.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1107.o0:0 "Понятно"
 dtp.1108.name:0 "§Y«ВЕДУЩИЙ»§! Игра окончена"
 dtp.1108.desc:0 "Партия завершена. Спасибо всем за игру!\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1108.o0:0 "Понятно"
 dtp.1109.name:0 "§Y«ВЕДУЩИЙ»§! Созыв Галактического сообщества"
 dtp.1109.desc:0 "Созывается Галактическое сообщество! Делегаты всех держав — к столу переговоров: обсуждаем резолюции и голосуем.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1109.o0:0 "Понятно"
 dtp.1110.name:0 "§Y«ВЕДУЩИЙ»§! Все в голосовой канал"
 dtp.1110.desc:0 "Ведущий просит всех игроков зайти в голосовой канал. Нужно обсудить важное.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1110.o0:0 "Понятно"
 dtp.1111.name:0 "§Y«ВЕДУЩИЙ»§! Голосование игроков"
 dtp.1111.desc:0 "Ведущий проводит голосование. Ответьте в голосовом канале или в чате партии.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1111.o0:0 "Понятно"
 dtp.1112.name:0 "§Y«ВЕДУЩИЙ»§! Дипломатический саммит"
 dtp.1112.desc:0 "Лидеры держав, соберитесь на саммит в голосовом канале для переговоров.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1112.o0:0 "Понятно"
 dtp.1113.name:0 "§Y«ВЕДУЩИЙ»§! Надвигается кризис"
 dtp.1113.desc:0 "Ведущий предупреждает: надвигается кризис галактического масштаба. Готовьте флоты и союзы.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1113.o0:0 "Понятно"
 dtp.1114.name:0 "§Y«ВЕДУЩИЙ»§! Ведущий отошёл"
 dtp.1114.desc:0 "Ведущий ненадолго отошёл. Не начинайте войн и крупных операций до его возвращения.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1114.o0:0 "Понятно"
 dtp.1115.name:0 "§Y«ВЕДУЩИЙ»§! Ведущий вернулся"
 dtp.1115.desc:0 "Ведущий снова в игре. Партия продолжается.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1115.o0:0 "Понятно"
 dtp.1116.name:0 "§Y«ВЕДУЩИЙ»§! Проверка готовности"
 dtp.1116.desc:0 "Ведущий проверяет, все ли готовы продолжать. Ответьте кнопкой ниже — ведущий увидит ваш ответ.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1116.o0:0 "§GГотов!§!"
 dtp.1116.o1:0 "§HНужно ещё время§!"
 dtp.1117.name:0 "Игрок готов"
 dtp.1117.desc:0 "§Y[From.GetName]§! §Gготов продолжать§!."
 dtp.1117.o0:0 "Хорошо"
 dtp.1118.name:0 "Игроку нужно время"
 dtp.1118.desc:0 "§Y[From.GetName]§! §Hпросит ещё немного времени§!."
 dtp.1118.o0:0 "Хорошо"
 dtp.1202.name:0 "§R«ВЕДУЩИЙ»§! Нарушение правил партии"
 dtp.1202.desc:0 "§Y[dtp_violator.GetName]§! объявил войну державе §Y[dtp_victim.GetName]§! вопреки запрету ведущего (общий запрет войн, личный запрет нападать или защита державы).\n\nВедущий решит, будут ли санкции.\n\n§gКонтроль правил Debug Toolpack.§!"
 dtp.1202.o0:0 "Понятно"
 dtp.1203.name:0 "§R«ВЕДУЩИЙ»§! Санкции ведущего"
 dtp.1203.desc:0 "За нарушение запрета войн для игроков ведущий наложил на вашу державу «Унижение» на 5 лет.\n\n§gКонтроль правил Debug Toolpack.§!"
 dtp.1203.o0:0 "Понятно"
 dtp.1208.name:0 "§R«ВЕДУЩИЙ»§! Нарушитель наказан"
 dtp.1208.desc:0 "Ведущий наказал §Y[dtp_violator.GetName]§! за нарушение запрета войн для игроков: «Унижение» на 5 лет (влияние −33%, дипломатический вес −25%, одобрение −10%).\n\n§gКонтроль правил Debug Toolpack.§!"
 dtp.1208.o0:0 "Понятно"
 dtp.1209.name:0 "§Y«ВЕДУЩИЙ»§! Нарушение прощено"
 dtp.1209.desc:0 "Ведущий простил §Y[dtp_violator.GetName]§! нарушение запрета войн для игроков — без санкций. Запрет войн продолжает действовать.\n\n§gКонтроль правил Debug Toolpack.§!"
 dtp.1209.o0:0 "Понятно"
 dtp.1240.desc_none_s0:0 "§YПРАВИЛА ПАРТИИ§!\n\n§GВойны игроков разрешены.§! Общего запрета сейчас нет.\n\nТаймер сессии не запущен.\n\nНарушения видят все игроки, решение о санкциях принимает ведущий.\n\n§gDebug Toolpack · ниже — ваши личные правила, если есть.§!"
 dtp.1240.desc_none_s1:0 "§YПРАВИЛА ПАРТИИ§!\n\n§GВойны игроков разрешены.§! Общего запрета сейчас нет.\n\nСессия закончится примерно в §Y[dtp_sess_owner.dtp_sess_y]§! году — за месяц до конца придёт напоминание.\n\nНарушения видят все игроки, решение о санкциях принимает ведущий.\n\n§gDebug Toolpack · ниже — ваши личные правила, если есть.§!"
 dtp.1240.desc_inf_s0:0 "§YПРАВИЛА ПАРТИИ§!\n\n§RВойны игроков запрещены бессрочно§! — пока ведущий не снимет запрет. Кнопка «Объявить войну» заблокирована.\n\nТаймер сессии не запущен.\n\nНарушения видят все игроки, решение о санкциях принимает ведущий.\n\n§gDebug Toolpack · ниже — ваши личные правила, если есть.§!"
 dtp.1240.desc_inf_s1:0 "§YПРАВИЛА ПАРТИИ§!\n\n§RВойны игроков запрещены бессрочно§! — пока ведущий не снимет запрет. Кнопка «Объявить войну» заблокирована.\n\nСессия закончится примерно в §Y[dtp_sess_owner.dtp_sess_y]§! году — за месяц до конца придёт напоминание.\n\nНарушения видят все игроки, решение о санкциях принимает ведущий.\n\n§gDebug Toolpack · ниже — ваши личные правила, если есть.§!"
 dtp.1240.desc_t_s0:0 "§YПРАВИЛА ПАРТИИ§!\n\n§RВойны игроков запрещены§! до §Y[dtp_rule_owner.dtp_rule_endy]§! года. Кнопка «Объявить войну» заблокирована, потом запрет снимется сам.\n\nТаймер сессии не запущен.\n\nНарушения видят все игроки, решение о санкциях принимает ведущий.\n\n§gDebug Toolpack · ниже — ваши личные правила, если есть.§!"
 dtp.1240.desc_t_s1:0 "§YПРАВИЛА ПАРТИИ§!\n\n§RВойны игроков запрещены§! до §Y[dtp_rule_owner.dtp_rule_endy]§! года. Кнопка «Объявить войну» заблокирована, потом запрет снимется сам.\n\nСессия закончится примерно в §Y[dtp_sess_owner.dtp_sess_y]§! году — за месяц до конца придёт напоминание.\n\nНарушения видят все игроки, решение о санкциях принимает ведущий.\n\n§gDebug Toolpack · ниже — ваши личные правила, если есть.§!"
 dtp.1240.name:0 "§Y«ВЕДУЩИЙ»§! Правила партии"
 dtp.1240.o_np:0 "Понятно. Вам лично запрещено объявлять войну до [Root.dtp_np_endy] г."
 dtp.1240.o_prot:0 "Понятно. Ваша держава под защитой ведущего до [Root.dtp_prot_endy] г."
 dtp.1240.o_ok:0 "Понятно. Личных запретов и защиты у вашей державы нет."
 dtp.1260.name:0 "§Y«ВЕДУЩИЙ»§! Заседание закрыто"
 dtp.1260.desc:0 "Заседание Галактического сообщества закрыто. Принятые решения вступают в силу; следующие голосования — по расписанию сообщества.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1260.o0:0 "Понятно"
 dtp.1262.name:0 "§Y«ВЕДУЩИЙ»§! Заседание открыто"
 dtp.1262.desc:0 "Ведущий открыл заседание сената Галактического сообщества. Делегаты держав, ваше слово: предлагайте резолюции и голосуйте.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1262.o0:0 "Понятно"
 dtp.1263.name:0 "§Y«ВЕДУЩИЙ»§! Резолюция отклонена"
 dtp.1263.desc:0 "Ведущий снял с голосования резолюцию Галактического сообщества — она §Rне принята§!.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1263.o0:0 "Понятно"
 dtp.1264.name:0 "§Y«ВЕДУЩИЙ»§! Новый Галактический император"
 dtp.1264.desc:0 "Ведущий провозгласил §Y[dtp_emp_new.GetName]§! Галактическим императором.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1264.o0:0 "Да здравствует Император"
 dtp.1261.name:0 "§Y«ВЕДУЩИЙ»§! Резолюция принята"
 dtp.1261.desc:0 "Ведущий завершил голосование: резолюция, за которую голосовало Галактическое сообщество, §Gпринята§! и вступает в силу.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1261.o0:0 "Понятно"
 dtp.1205.name:0 "§Y«ВЕДУЩИЙ»§! Войны игроков запрещены"
 dtp.1205.desc:0 "Ведущий запретил войны игроков до §Y[dtp_rule_owner.dtp_rule_endy]§! года (лет: §Y[dtp_rule_owner.dtp_rule_len]§!).\n\n§RПравило работает:§! кнопка «Объявить войну» заблокирована; если война всё же начнётся, все получат оповещение, а ведущий может наказать нарушителя. По истечении срока запрет снимется сам.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1205.o0:0 "Понятно"
 dtp.1206.name:0 "§Y«ВЕДУЩИЙ»§! Срок запрета войн истёк"
 dtp.1206.desc:0 "Срок запрета войн для игроков закончился. С этого момента игроки снова могут объявлять войны.\n\n§gКонтроль правил Debug Toolpack.§!"
 dtp.1206.o0:0 "Понятно"
 dtp.1216.name:0 "§Y«ВЕДУЩИЙ»§! Таймер сессии"
 dtp.1216.desc:0 "Ведущий поставил таймер: сегодняшняя сессия закончится примерно в §Y[dtp_sess_owner.dtp_sess_y]§! году (через §Y[dtp_sess_owner.dtp_sess_m]§! мес. игрового времени). За месяц до конца придёт напоминание.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1216.o0:0 "Понятно"
 dtp.1217.name:0 "§Y«ВЕДУЩИЙ»§! Сессия скоро закончится"
 dtp.1217.desc:0 "До конца сессии остался §Yодин месяц§! игрового времени. Завершайте дела, не начинайте крупных операций.\n\n§gТаймер сессии Debug Toolpack.§!"
 dtp.1217.o0:0 "Понятно"
 dtp.1218.name:0 "§Y«ВЕДУЩИЙ»§! Сессия окончена"
 dtp.1218.desc:0 "Время сессии вышло. §YСтавим паузу и сохраняемся§! — ХОСТ сохранит игру, продолжим в следующий раз.\n\n§gТаймер сессии Debug Toolpack.§!"
 dtp.1218.o0:0 "Понятно"
 dtp.1211.name:0 "§Y«ВЕДУЩИЙ»§! Личный запрет на войну"
 dtp.1211.desc:0 "Ведущий запретил державе §Y[dtp_rule_subj.GetName]§! объявлять войну до §Y[dtp_rule_subj.dtp_np_endy]§! года.\n\n§RПравило работает:§! её кнопка «Объявить войну» заблокирована; если война всё же начнётся, все получат оповещение, а ведущий может наказать нарушителя.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1211.o0:0 "Понятно"
 dtp.1212.name:0 "§Y«ВЕДУЩИЙ»§! Держава под защитой"
 dtp.1212.desc:0 "Ведущий взял державу §Y[dtp_rule_subj.GetName]§! под защиту до §Y[dtp_rule_subj.dtp_prot_endy]§! года: игрокам нельзя объявлять ей войну.\n\n§RПравило работает:§! кнопка «Объявить войну» против неё у игроков заблокирована; если война всё же начнётся, все получат оповещение, а ведущий может наказать нарушителя.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1212.o0:0 "Понятно"
 dtp.1213.name:0 "§Y«ВЕДУЩИЙ»§! Личный запрет истёк"
 dtp.1213.desc:0 "Срок личного запрета на войну для державы §Y[dtp_rule_subj.GetName]§! закончился.\n\n§gКонтроль правил Debug Toolpack.§!"
 dtp.1213.o0:0 "Понятно"
 dtp.1214.name:0 "§Y«ВЕДУЩИЙ»§! Защита истекла"
 dtp.1214.desc:0 "Срок защиты державы §Y[dtp_rule_subj.GetName]§! закончился — на неё снова можно нападать.\n\n§gКонтроль правил Debug Toolpack.§!"
 dtp.1214.o0:0 "Понятно"
 dtp.1215.name:0 "§Y«ВЕДУЩИЙ»§! Личные правила сняты"
 dtp.1215.desc:0 "Ведущий снял с державы §Y[dtp_rule_subj.GetName]§! личный запрет на войну и защиту.\n\n§gКонтроль правил Debug Toolpack.§!"
 dtp.1215.o0:0 "Понятно"
 dtp.1009.name:0 "§Y«ВЕДУЩИЙ»§! Белый мир"
 dtp.1009.desc:0 "Ведущий завершил войну между §Y[dtp_wp_a.GetName]§! и §Y[dtp_wp_b.GetName]§! белым миром: никто ничего не получает, стороны заключают перемирие.\n\n§gОбъявление ведущего партии через Debug Toolpack.§!"
 dtp.1009.o0:0 "Понятно"
 dtp.1008.name:0 "Объявление администратора"
 dtp.1008.desc:0 "Администратор §Y[dtp_last_actor.GetName]§! вносит изменения через Debug Toolpack."
 dtp.1008.o0:0 "Понятно"
