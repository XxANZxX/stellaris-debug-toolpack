 dtp.13.name:0 "HOST status request"
 dtp.13.desc:0 "Player §Y[dtp_claimant.GetName]§! requests §YHOST§! status of Debug Toolpack.\n\nThe HOST gets full access to the tools for every state, including yours. Vote «Yes» only if this really is the game's host."
 dtp.13.o0:0 "Against"
 dtp.13.o1:0 "Yes - this is the game's host"
 dtp.14.name:0 "The vote has expired"
 dtp.14.desc:0 "Not all players answered within 30 days. The request was cancelled."
 dtp.14.o0:0 "Understood"
 dtp.15.name:0 "HOST status transfer"
 dtp.15.desc:0 "HOST §Y[dtp_offer_from.GetName]§! offers to transfer Debug Toolpack §YHOST§! status to you."
 dtp.15.o0:0 "Decline"
 dtp.15.o1:0 "Accept"
 dtp.19.name:0 "Game Master role"
 dtp.19.desc:0 "You have become the §YHOST§! of this game. Debug Toolpack offers you the §YGAME MASTER ROLE§! - a game master who runs the game instead of competing with the players.\n\n§YWHAT THE ROLE GIVES§!\n§G+§! you see the whole galaxy: every system, fleet and empire (full sensor range, the whole map, contact with everyone)\n§G+§! intel, encryption and decryption 1000 - nothing is hidden from you, nobody can spy on you\n§G+§! research and all resources ×1000, storage +1,000,000, stability +50\n§G+§! the closed «Game Master» ethic - it cannot be picked when creating an empire\n§G+§! nobody can declare war on you or close borders to you; megacorp and syndicate branch offices on your planets are forbidden\n§G+§! you yourself can do anything: wars, treaties, borders\n\n§RIMPORTANT: YOU WILL NOT BE ABLE TO PLAY AS A NORMAL EMPIRE§!\n§R-§! your empire becomes a special «Game Master» type, like a Fallen Empire: no population growth\n§R-§! the Galactic Community will not accept you, and you take no part in forming it\n§R-§! some regular mechanics (policies, diplomatic stances, planet designations) may be unavailable\n§R-§! this is a game master role: you do not compete with the players for victory\n\nYou can drop the role at any time: Debug Toolpack -> «Access» -> «Drop the Game Master role» - your empire becomes regular again."
 dtp.19.o0:0 "Take the Game Master role"
 dtp.19.o1:0 "Not now"
 dtp.17.name:0 "HOST status not confirmed"
 dtp.17.desc:0 "The request was rejected by one of the players."
 dtp.17.o0:0 "Understood"
 dtp.18.name:0 "HOST assigned"
 dtp.18.desc:0 "New Debug Toolpack §YHOST§!: §Y[dtp_host.GetName]§!."
 dtp.18.o0:0 "Understood"
 dtp.1001.name:0 "Connection check"
 dtp.1001.desc:0 "Debug Toolpack test event from §Y[dtp_last_actor.GetName]§!."
 dtp.1001.o0:0 "Connection OK"
 dtp.1002.name:0 "Gift of the Custodians"
 dtp.1002.desc:0 "The Custodians offer your empire a gift."
 dtp.1002.o0:0 "Energy (+5000)"
 dtp.1002.o1:0 "Alloys (+2000)"
 dtp.1002.o2:0 "Unity (+1000)"
 dtp.1003.name:0 "Unrest in the capital"
 dtp.1003.desc:0 "Unrest has broken out in the capital."
 dtp.1003.o0:0 "Suppress by force"
 dtp.1003.o1:0 "Pay them off (-1000 energy)"
 dtp.1004.name:0 "Geological discovery"
 dtp.1004.desc:0 "New deposits have been found on planet §Y[Root.GetName]§!."
 dtp.1004.o0:0 "Excellent"
 dtp.1005.name:0 "Repair crew"
 dtp.1005.desc:0 "A repair crew has reached fleet §Y[Root.GetName]§!."
 dtp.1005.o0:0 "Let's go"
 dtp.1006.name:0 "Scientific breakthrough"
 dtp.1006.desc:0 "Scientists have made a breakthrough."
 dtp.1006.o0:0 "Superb"
 dtp.1007.name:0 "Peace offer"
 dtp.1007.desc:0 "§Y[dtp_last_actor.GetName]§! offers a truce."
 dtp.1007.o0:0 "Reject"
 dtp.1007.o1:0 "Accept"
 dtp.1101.name:0 "§Y«GAME MASTER»§! Game break"
 dtp.1101.desc:0 "The game master announced a break. The game is paused - back in about 10 minutes.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1101.o0:0 "Understood"
 dtp.1102.name:0 "§Y«GAME MASTER»§! Save and restart"
 dtp.1102.desc:0 "The game master is saving the game and restarting the session. Don't leave the lobby.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1102.o0:0 "Understood"
 dtp.1103.name:0 "§Y«GAME MASTER»§! Wars for players are allowed"
 dtp.1103.desc:0 "From now on players may declare war. The ban on wars no longer applies.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1103.o0:0 "Understood"
 dtp.1104.name:0 "§Y«GAME MASTER»§! Wars for players are forbidden"
 dtp.1104.desc:0 "Wars for players are forbidden until further notice from the game master. §RThis rule is enforced:§! the «Declare War» button is blocked; if a war still starts, everyone gets an alert and the game master can punish the violator.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1104.o0:0 "Understood"
 dtp.1105.name:0 "§Y«GAME MASTER»§! Game master's warning"
 dtp.1105.desc:0 "The game master reminds you of the game rules. Repeated violations may lead to sanctions.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1105.o0:0 "Understood"
 dtp.1106.name:0 "§Y«GAME MASTER»§! The session ends soon"
 dtp.1106.desc:0 "There is little time left in today's session. Wrap things up.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1106.o0:0 "Understood"
 dtp.1107.name:0 "§Y«GAME MASTER»§! Session over"
 dtp.1107.desc:0 "The session is over. The HOST keeps the save; we continue next time at the same time.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1107.o0:0 "Understood"
 dtp.1108.name:0 "§Y«GAME MASTER»§! Game over"
 dtp.1108.desc:0 "The game is over. Thanks everyone for playing!\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1108.o0:0 "Understood"
 dtp.1109.name:0 "§Y«GAME MASTER»§! The Galactic Community convenes"
 dtp.1109.desc:0 "The Galactic Community convenes! Delegates of all empires - to the negotiating table: we discuss resolutions and vote.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1109.o0:0 "Understood"
 dtp.1110.name:0 "§Y«GAME MASTER»§! Everyone to the voice channel"
 dtp.1110.desc:0 "The game master asks all players to join the voice channel. Something important needs discussing.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1110.o0:0 "Understood"
 dtp.1111.name:0 "§Y«GAME MASTER»§! Player vote"
 dtp.1111.desc:0 "The game master is holding a vote. Answer in the voice channel or the game chat.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1111.o0:0 "Understood"
 dtp.1112.name:0 "§Y«GAME MASTER»§! Diplomatic summit"
 dtp.1112.desc:0 "Leaders of the empires, gather in the voice channel for a summit and negotiations.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1112.o0:0 "Understood"
 dtp.1113.name:0 "§Y«GAME MASTER»§! A crisis is coming"
 dtp.1113.desc:0 "The game master warns: a galaxy-scale crisis is coming. Prepare your fleets and alliances.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1113.o0:0 "Understood"
 dtp.1114.name:0 "§Y«GAME MASTER»§! The game master stepped away"
 dtp.1114.desc:0 "The game master stepped away for a moment. Do not start wars or major operations until they return.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1114.o0:0 "Understood"
 dtp.1115.name:0 "§Y«GAME MASTER»§! The game master is back"
 dtp.1115.desc:0 "The game master is back in the game. The game continues.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1115.o0:0 "Understood"
 dtp.1116.name:0 "§Y«GAME MASTER»§! Ready check"
 dtp.1116.desc:0 "The game master is checking whether everyone is ready to continue. Answer with a button below - the game master will see your reply.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1116.o0:0 "§GReady!§!"
 dtp.1116.o1:0 "§HI need more time§!"
 dtp.1117.name:0 "Player ready"
 dtp.1117.desc:0 "§Y[From.GetName]§! §Gis ready to continue§!."
 dtp.1117.o0:0 "Good"
 dtp.1118.name:0 "Player needs time"
 dtp.1118.desc:0 "§Y[From.GetName]§! §Hasks for a little more time§!."
 dtp.1118.o0:0 "Good"
 dtp.1202.name:0 "§R«GAME MASTER»§! Game rules violated"
 dtp.1202.desc:0 "§Y[dtp_violator.GetName]§! declared war on §Y[dtp_victim.GetName]§! despite the game master's ban (general war ban, personal attack ban or empire protection).\n\nThe game master will decide on sanctions.\n\n§gDebug Toolpack rule control.§!"
 dtp.1202.o0:0 "Understood"
 dtp.1203.name:0 "§R«GAME MASTER»§! Game master sanctions"
 dtp.1203.desc:0 "For breaking the ban on wars for players, the game master has put «Humiliated» on your empire for 5 years.\n\n§gDebug Toolpack rule control.§!"
 dtp.1203.o0:0 "Understood"
 dtp.1208.name:0 "§R«GAME MASTER»§! Violator punished"
 dtp.1208.desc:0 "The game master has punished §Y[dtp_violator.GetName]§! for breaking the ban on wars for players: «Humiliated» for 5 years (influence -33%, diplomatic weight -25%, approval -10%).\n\n§gDebug Toolpack rule control.§!"
 dtp.1208.o0:0 "Understood"
 dtp.1209.name:0 "§Y«GAME MASTER»§! Violation forgiven"
 dtp.1209.desc:0 "The game master has forgiven §Y[dtp_violator.GetName]§! for breaking the ban on wars for players - no sanctions. The war ban stays in effect.\n\n§gDebug Toolpack rule control.§!"
 dtp.1209.o0:0 "Understood"
 dtp.1240.desc_none_s0:0 "§YGAME RULES§!\n\n§GWars for players are allowed.§! There is no general ban right now.\n\nThe session timer is not running.\n\nEveryone sees violations; the game master decides on sanctions.\n\n§gDebug Toolpack · your personal rules, if any, are below.§!"
 dtp.1240.desc_none_s1:0 "§YGAME RULES§!\n\n§GWars for players are allowed.§! There is no general ban right now.\n\nThe session ends around §Y[dtp_sess_owner.dtp_sess_y]§! - a reminder comes one month before.\n\nEveryone sees violations; the game master decides on sanctions.\n\n§gDebug Toolpack · your personal rules, if any, are below.§!"
 dtp.1240.desc_inf_s0:0 "§YGAME RULES§!\n\n§RWars for players are forbidden indefinitely§! - until the game master lifts the ban. The «Declare War» button is blocked.\n\nThe session timer is not running.\n\nEveryone sees violations; the game master decides on sanctions.\n\n§gDebug Toolpack · your personal rules, if any, are below.§!"
 dtp.1240.desc_inf_s1:0 "§YGAME RULES§!\n\n§RWars for players are forbidden indefinitely§! - until the game master lifts the ban. The «Declare War» button is blocked.\n\nThe session ends around §Y[dtp_sess_owner.dtp_sess_y]§! - a reminder comes one month before.\n\nEveryone sees violations; the game master decides on sanctions.\n\n§gDebug Toolpack · your personal rules, if any, are below.§!"
 dtp.1240.desc_t_s0:0 "§YGAME RULES§!\n\n§RWars for players are forbidden§! until §Y[dtp_rule_owner.dtp_rule_endy]§!. The «Declare War» button is blocked; then the ban lifts itself.\n\nThe session timer is not running.\n\nEveryone sees violations; the game master decides on sanctions.\n\n§gDebug Toolpack · your personal rules, if any, are below.§!"
 dtp.1240.desc_t_s1:0 "§YGAME RULES§!\n\n§RWars for players are forbidden§! until §Y[dtp_rule_owner.dtp_rule_endy]§!. The «Declare War» button is blocked; then the ban lifts itself.\n\nThe session ends around §Y[dtp_sess_owner.dtp_sess_y]§! - a reminder comes one month before.\n\nEveryone sees violations; the game master decides on sanctions.\n\n§gDebug Toolpack · your personal rules, if any, are below.§!"
 dtp.1240.name:0 "§Y«GAME MASTER»§! Game rules"
 dtp.1240.o_np:0 "Understood. You personally may not declare war until [Root.dtp_np_endy]."
 dtp.1240.o_prot:0 "Understood. Your empire is under the game master's protection until [Root.dtp_prot_endy]."
 dtp.1240.o_ok:0 "Understood. Your empire has no personal bans or protection."
 dtp.1260.name:0 "§Y«GAME MASTER»§! Session closed"
 dtp.1260.desc:0 "The Galactic Community session is closed. Decisions taken come into force; the next votes follow the Community's schedule.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1260.o0:0 "Understood"
 dtp.1262.name:0 "§Y«GAME MASTER»§! Session opened"
 dtp.1262.desc:0 "The game master has opened a session of the Galactic Community senate. Delegates, the floor is yours: propose resolutions and vote.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1262.o0:0 "Understood"
 dtp.1263.name:0 "§Y«GAME MASTER»§! Resolution rejected"
 dtp.1263.desc:0 "The game master has withdrawn a Galactic Community resolution from the vote - it is §Rnot passed§!.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1263.o0:0 "Understood"
 dtp.1264.name:0 "§Y«GAME MASTER»§! New Galactic Emperor"
 dtp.1264.desc:0 "The game master has proclaimed §Y[dtp_emp_new.GetName]§! Galactic Emperor.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1264.o0:0 "Long live the Emperor"
 dtp.1261.name:0 "§Y«GAME MASTER»§! Resolution passed"
 dtp.1261.desc:0 "The game master has ended the vote: the resolution the Galactic Community was voting on is §Gpassed§! and takes effect.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1261.o0:0 "Understood"
 dtp.1205.name:0 "§Y«GAME MASTER»§! Wars for players are forbidden"
 dtp.1205.desc:0 "The game master has forbidden wars for players until §Y[dtp_rule_owner.dtp_rule_endy]§! (years: §Y[dtp_rule_owner.dtp_rule_len]§!).\n\n§RThis rule is enforced:§! the «Declare War» button is blocked; if a war still starts, everyone gets an alert and the game master can punish the violator. When the term ends, the ban lifts itself.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1205.o0:0 "Understood"
 dtp.1206.name:0 "§Y«GAME MASTER»§! War ban has expired"
 dtp.1206.desc:0 "The ban on wars for players has ended. From now on players may declare war again.\n\n§gDebug Toolpack rule control.§!"
 dtp.1206.o0:0 "Understood"
 dtp.1216.name:0 "§Y«GAME MASTER»§! Session timer"
 dtp.1216.desc:0 "The game master has set a timer: today's session will end around §Y[dtp_sess_owner.dtp_sess_y]§! (in §Y[dtp_sess_owner.dtp_sess_m]§! months of game time). A reminder comes one month before the end.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1216.o0:0 "Understood"
 dtp.1217.name:0 "§Y«GAME MASTER»§! The session ends soon"
 dtp.1217.desc:0 "There is §Yone month§! of game time left in the session. Wrap things up, don't start major operations.\n\n§gDebug Toolpack session timer.§!"
 dtp.1217.o0:0 "Understood"
 dtp.1218.name:0 "§Y«GAME MASTER»§! Session over"
 dtp.1218.desc:0 "Session time is up. §YPause and save§! - the HOST will save the game, we continue next time.\n\n§gDebug Toolpack session timer.§!"
 dtp.1218.o0:0 "Understood"
 dtp.1211.name:0 "§Y«GAME MASTER»§! Personal war ban"
 dtp.1211.desc:0 "The game master has forbidden §Y[dtp_rule_subj.GetName]§! to declare war until §Y[dtp_rule_subj.dtp_np_endy]§!.\n\n§RThis rule is enforced:§! its «Declare War» button is blocked; if a war still starts, everyone gets an alert and the game master can punish the violator.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1211.o0:0 "Understood"
 dtp.1212.name:0 "§Y«GAME MASTER»§! Empire under protection"
 dtp.1212.desc:0 "The game master has put §Y[dtp_rule_subj.GetName]§! under protection until §Y[dtp_rule_subj.dtp_prot_endy]§!: players may not declare war on it.\n\n§RThis rule is enforced:§! players' «Declare War» button against it is blocked; if a war still starts, everyone gets an alert and the game master can punish the violator.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1212.o0:0 "Understood"
 dtp.1213.name:0 "§Y«GAME MASTER»§! Personal ban expired"
 dtp.1213.desc:0 "The personal war ban for §Y[dtp_rule_subj.GetName]§! has ended.\n\n§gDebug Toolpack rule control.§!"
 dtp.1213.o0:0 "Understood"
 dtp.1214.name:0 "§Y«GAME MASTER»§! Protection expired"
 dtp.1214.desc:0 "The protection of §Y[dtp_rule_subj.GetName]§! has ended - it may be attacked again.\n\n§gDebug Toolpack rule control.§!"
 dtp.1214.o0:0 "Understood"
 dtp.1215.name:0 "§Y«GAME MASTER»§! Personal rules removed"
 dtp.1215.desc:0 "The game master has removed the personal war ban and protection from §Y[dtp_rule_subj.GetName]§!.\n\n§gDebug Toolpack rule control.§!"
 dtp.1215.o0:0 "Understood"
 dtp.1009.name:0 "§Y«GAME MASTER»§! White peace"
 dtp.1009.desc:0 "The game master has ended the war between §Y[dtp_wp_a.GetName]§! and §Y[dtp_wp_b.GetName]§! with a white peace: nobody gains anything, the sides sign a truce.\n\n§gAnnouncement from the game master via Debug Toolpack.§!"
 dtp.1009.o0:0 "Understood"
 dtp.1008.name:0 "Administrator announcement"
 dtp.1008.desc:0 "Administrator §Y[dtp_last_actor.GetName]§! is making changes through Debug Toolpack."
 dtp.1008.o0:0 "Understood"
