 dtp_b_gr_p_prot_tt:0 "Players may not attack empire A for the typed term (e.g. newcomer protection). An attack is a violation. All players get a window about the protection.\n\n$dtp_note_pvp$"
 dtp_b_gr_p_clr:0 "Remove A's personal rules"
 dtp_b_gr_p_clr_tt:0 "Remove empire A's attack ban and protection. All players get a window.\n\n$dtp_note_pvp$"
 dtp_b_gr_p_clr_x:0 "§gA has no personal rules§!"
 dtp_b_gr_h3:0 "§YVIOLATIONS§!  §gwho attacked despite the general ban, a personal ban or protection§!"
 dtp_b_gr_none:0 "§gNo violations.§!"
 dtp_b_go_r_viol:0 "§RVIOLATION:§! §Y[dtp_violator.GetName]§! -> [dtp_victim.GetName] §g· times: [dtp_violator.dtp_viol]§!"
 dtp_b_go_r_viol2:0 "§RVIOLATION recorded§! §g- the empire no longer exists§!"
 dtp_need_viol:0 "The violator no longer exists"
 dtp_b_go_r_punish:0 "Humiliate (5 yrs)"
 dtp_b_go_r_punish_tt:0 "Put the game modifier «Humiliated» on the violator for 5 years (influence -33%, diplomatic weight -25%, approval -10%). The violator gets a window explaining why; the other players get the «Violator punished» window."
 dtp_b_go_r_forgive:0 "Forgive and close"
 dtp_b_go_r_forgive_tt:0 "Close the violation without sanctions - all players get the «Violation forgiven» window. The empire's violation counter is kept."
 dtp_b_gr_how2:0 "§gHard mode: the «Declare war» button is greyed out. Soft: war can be declared, but it is a violation - everyone gets a window, sanctions are here.§!"
 dtp_b_gr_how3:0 "§gWars with the AI are not violations unless «AI: also banned» is selected at the top right. A script cannot stop a war that has already started.§!"
