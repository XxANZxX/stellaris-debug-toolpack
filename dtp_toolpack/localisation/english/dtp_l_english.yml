 dtp_b_m_star_off:0 "Red markers over systems: OFF"
 dtp_b_m_star_off_tt:0 "Turn on: every marked system gets a red «* MARKED» marker on the galaxy map (all players see it)."
 dtp_b_m_reveal:0 "Reveal the whole map for me"
 dtp_b_m_reveal_tt:0 "Every system in the galaxy becomes visited for your empire: uncharted space disappears, stars, hyperlanes and owners become visible. This is a real in-game action - for you only."
 dtp_b_m_survey:0 "Survey all planets for me"
 dtp_b_m_survey_tt:0 "Every planet in the galaxy becomes surveyed for your empire (resources and habitability visible). This is a real in-game action - for you only."
 dtp_b_mk_mode_m:0 "Ship: §RMARKS§! systems"
 dtp_b_mk_mode_m_tt:0 "The marker ship now MARKS systems: enters - the system is marked (already marked ones untouched). Click - switch to REMOVE marks."
 dtp_b_mk_mode_u:0 "Ship: §GREMOVES§! marks"
 dtp_b_mk_mode_u_tt:0 "The marker ship now REMOVES marks: enters a marked system - the mark is removed (unmarked ones untouched). Click - switch to MARK."
 dtp_b_mk_how0:0 "§gMarker ship - mark systems right on the map§!"
 dtp_b_mk_new:0 "Marker ship: create"
 dtp_b_mk_new_tt:0 "Create a marker ship at your capital. Only you can see it: cloaking 1000 - neither players nor AI will detect it. Speed ×5000, jump with no windup or cooldown, jump range ×1000. How to mark: select the ship, right-click any system on the galaxy map (including unowned ones) - every system the ship enters is marked, the whole route (remove extras with «Clear all marks» or the «REMOVES» mode). «REMOVES» mode (button top left) - the ship removes marks instead."
 dtp_b_mk_del:0 "Marker ship: remove"
 dtp_b_mk_del_tt:0 "Remove the marker ship. System marks stay."
 dtp_need_cur:0 "First pick a system in the navigator"
 dtp_b_mk_cur:0 "Ship -> to navigator cursor"
 dtp_b_mk_cur_tt:0 "Instantly move the marker ship to the system under the navigator cursor (no marking)."
 dtp_b_mk_home:0 "Ship -> to my capital"
 dtp_b_mk_home_tt:0 "Instantly return the marker ship to your capital (no marking)."
 dtp_need_force:0 "Forced mode required («State» tab)"
 dtp_b_m_free2:0 "Unclaim + remove colonies"
 dtp_b_m_free2_tt:0 "Destroy colonies in marked systems and demolish starbases: the systems become fully unclaimed (forced mode). Requires confirmation."
 dtp_b_m_free2_ok:0 "§YCONFIRM:§! DESTROY colonies and starbases in marked systems"
 dtp_b_m_free2_ok_tt:0 "Confirm and perform the action on the button. «Cancel» on the right changes nothing."
 dtp_b_m_free2_ok_x:0 "Cancel"
 dtp_b_m_free2_ok_x_tt:0 "Cancel - change nothing."
