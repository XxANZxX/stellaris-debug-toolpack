 dtp_b_ac_transfer:0 "Transfer HOST status to the target empire"
 dtp_b_ac_transfer_tt:0 "The player gets a request; the status transfers after they agree."
 dtp_need_host2:0 "Only the HOST can take the Game Master role"
 dtp_b_ac_gm_on:0 "Take the Game Master role"
 dtp_b_ac_gm_on_tt:0 "Your empire becomes the Game Master empire: it sees the whole galaxy and every empire, intel and encryption 1000, huge bonuses to research and resources, no population growth. The Galactic Community ignores you (like a Fallen Empire) and won't accept you. Nobody can declare war on you or close borders to you (everyone opens borders to you and you to them); megacorp and syndicate branch offices on your planets are forbidden (existing ones are closed). You yourself can do anything. Removed with «Drop the role»."
 dtp_b_ac_gm_off:0 "Drop the Game Master role"
 dtp_b_ac_gm_off_tt:0 "Your empire becomes a regular empire again: the Game Master ethic, bonuses and special rules are removed."
 dtp_b_ac_gm_st1:0 "§YGame Master role: TAKEN§!"
 dtp_b_ac_gm_st0:0 "§gGame Master role: not taken§!"
 dtp_b_ac_note:0 "Permission checks are real: the game tells the button who pressed it, and permissions are checked on execution."
 dtp_b_ac_how0:0 "§YHOW THE HOST IS ASSIGNED§!  §gonly the game host, no vote§!"
 dtp_b_ac_how1:0 "§g1. New game: one day after the start the host becomes HOST automatically - their empire is the first (number 0).§!"
 dtp_b_ac_how2:0 "§g2. Loaded save: «Make the first player empire HOST» or in advance in single player «Become HOST».§!"
 dtp_b_ac_how3:0 "§g3. Then the HOST alone grants permissions (buttons above) and can transfer the status. A vote only if there is no HOST.§!"
